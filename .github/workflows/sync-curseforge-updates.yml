name: Update Forge version notices from CurseForge
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-version-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh update feed from released CurseForge files
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python scripts/sync_curseforge_updates.py
      - name: Commit update feed when changed
        run: |
          if ! git diff --quiet -- update.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add update.json
            git commit -m 'Update Forge version feed from CurseForge'
            git push
          fi
